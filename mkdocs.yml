site_name: Jobbot
site_description: >-
  Tu próximo paso, con inteligencia. CLI local para buscar trabajo: CV estructurado,
  matching real y postulaciones que envías tú.
site_url: https://ljofreflor.github.io/jobbot/
site_author: Jobbot
repo_url: https://github.com/ljofreflor/jobbot
repo_name: ljofreflor/jobbot
edit_uri: edit/main/docs/
copyright: Jobbot — personas · oportunidades · tecnología

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: docs/overrides
  language: es
  favicon: assets/brand/favicon.png
  logo: assets/brand/logo-mark.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

plugins:
  - search:
      lang:
        - es
        - en
  # One blog instance, Spanish by default. English posts live in the same
  # instance under the "English" category until a second language is wired up.
  - blog:
      blog_dir: blog
      blog_toc: true
      post_url_format: "{date}/{slug}"
      post_date_format: long
      archive_date_format: yyyy
      authors: false
      categories_allowed:
        - Mediciones
        - Measurements
        - Ensayos
        - Ética
      pagination_per_page: 10

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/brand.css
  - stylesheets/landing.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ljofreflor/jobbot
      name: Jobbot en GitHub
  # Language switcher. The site is Spanish-first; English pages live under /en/.
  alternate:
    - name: Español
      link: /jobbot/
      lang: es
    - name: English
      link: /jobbot/en/
      lang: en

nav:
  - Inicio: index.md
  - Manifiesto: manifesto.md
  - Instalación: instalacion.md
  - Comandos: comandos.md
  - Prior art: prior-art.md
  - Blog:
      - blog/index.md
  - English:
      - en/index.md

# Reference pages reached by link, not from the menu.
not_in_nav: |
  capabilities.md
  cli-sdk-migration.md
  library-audit.md
  portal-learning.md
  source-catalog.md
  sdk.md
  software-design.md
  tutorial.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
