# Chilean source catalog — seed for `jobbot portals catalog import` (public data only).
#
#   uv run jobbot portals catalog import data/sources-cl.example.yaml          # dry-run
#   uv run jobbot portals catalog import data/sources-cl.example.yaml --apply  # writes
#
# What this file is: the compact inventory of the 2026-10-12 research into where Chilean
# employers publish vacancies. Every row is one *observed* channel: an employer or brand,
# the URL where it was seen, the ATS family the page showed, what kind of surface it is,
# and what a plain web reader got from it that day.
#
# What this file is NOT:
#   - not a census of Chilean employers (the research queue below is the backlog);
#   - not proof that a channel has open vacancies today;
#   - not permission to extract: robots.txt and terms are checked per source, later;
#   - not a statement that JobBot supports the ATS. `ats` is an observation about the
#     page, never a capability. Capabilities start `unknown` and are proven one by one.
#
# `read` is the state of that single reading, never a verdict about the portal:
#   fetched              content came back (says nothing about listing completeness)
#   js_required          the listing renders client-side; plain HTML has no vacancies
#   no_content           answered, but the reader got no usable content
#   reader_error         the reader failed (403, 404, timeout…) — revalidate, do not bury
#   pending_destination  the link is official but its destination was not resolved yet
#
# Nothing here is enabled: the importer refuses a seed that tries to.
catalog_version: "0.1.0"
country: CL
researched_at: 2026-10-12
notes: >-
  Compact inventory transcribed from the research JSON (schema 0.1.0) attached to the
  Chilean source-catalog issue. The full JSON keeps per-channel notes and evidence that
  this summary drops; import it the same way when it lands in the repository.

# The importer compares what it read against these numbers and refuses a silent loss.
expected:
  employers: 194
  channels: 249
  sectors: 15
  by_type:
    listing: 195
    access: 47
    cv_inbox: 5
    job_posting: 2
  by_read:
    fetched: 204
    js_required: 14
    no_content: 4
    reader_error: 26
    pending_destination: 1

